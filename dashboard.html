<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetSaúde | Painel</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #0056b3;
            --primary-hover: #004494;
            --primary-light: #e8f0fc;
            --accent: #f97316;
            --green: #10b981;
            --green-light: #d1fae5;
            --amber: #f59e0b;
            --amber-light: #fef3c7;
            --red: #ef4444;
            --red-light: #fee2e2;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --surface: #ffffff;
            --bg: #f0f5ff;
            --sidebar-w: 240px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Sora',sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: var(--sidebar-w); background: #0a1628;
            display: flex; flex-direction: column;
            position: fixed; top:0; left:0; height:100vh; z-index:100;
            overflow: hidden;
        }
        .sb-logo {
            padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.06);
            font-family:'Space Mono',monospace; color:white; font-size:1rem; font-weight:700;
            display:flex; align-items:center; gap:10px;
        }
        .sb-logo i { color:#60a5fa; font-size:1.2rem; }
        .sb-logo span { font-size:0.65rem; color:rgba(255,255,255,0.4); display:block; margin-top:2px; font-family:'Sora',sans-serif; font-weight:400; }
        .sb-user {
            padding:16px 20px; display:flex; align-items:center; gap:12px;
            border-bottom:1px solid rgba(255,255,255,0.06); margin-bottom:8px;
        }
        .sb-avatar {
            width:36px; height:36px; border-radius:10px;
            background:linear-gradient(135deg,#3b82f6,#0056b3);
            display:flex; align-items:center; justify-content:center;
            color:white; font-weight:700; font-size:0.8rem; flex-shrink:0;
        }
        .sb-user-name  { color:white; font-size:0.83rem; font-weight:600; }
        .sb-user-badge { display:inline-block; font-size:0.65rem; padding:2px 8px; border-radius:20px; margin-top:3px; }
        .badge-cidadao { background:rgba(59,130,246,0.2); color:#93c5fd; }
        .badge-clinica  { background:rgba(16,185,129,0.2); color:#6ee7b7; }
        .badge-adm      { background:rgba(249,115,22,0.2); color:#fdba74; }
        nav { flex:1; padding:8px 0; }
        .nav-item {
            display:flex; align-items:center; gap:12px;
            padding:11px 20px; color:rgba(255,255,255,0.5);
            font-size:0.83rem; font-weight:600; cursor:pointer;
            transition:all 0.2s; border:none; background:none;
            width:100%; text-align:left; font-family:'Sora',sans-serif;
            border-left:3px solid transparent;
        }
        .nav-item i { width:18px; text-align:center; font-size:0.95rem; }
        .nav-item:hover { color:white; background:rgba(255,255,255,0.04); }
        .nav-item.active { color:white; background:rgba(59,130,246,0.12); border-left-color:#3b82f6; }
        .nav-section-label { padding:16px 20px 6px; font-size:0.65rem; text-transform:uppercase; letter-spacing:1px; color:rgba(255,255,255,0.2); }
        .sb-footer { padding:16px 20px; border-top:1px solid rgba(255,255,255,0.06); }
        .btn-logout {
            display:flex; align-items:center; gap:8px;
            color:rgba(255,255,255,0.35); font-size:0.78rem; cursor:pointer;
            background:none; border:none; font-family:'Sora',sans-serif; transition:color 0.2s;
        }
        .btn-logout:hover { color:var(--red); }

        /* ===== MAIN ===== */
        .main { margin-left:var(--sidebar-w); flex:1; padding:32px 36px; min-height:100vh; }
        .page-header { margin-bottom:28px; }
        .page-header h1 { font-size:1.55rem; font-weight:700; color:var(--text); }
        .page-header p  { color:var(--muted); font-size:0.88rem; margin-top:4px; }

        /* ===== MÉTRICAS ===== */
        .metrics-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:28px; }
        .metric-card {
            background:var(--surface); border-radius:16px; padding:20px;
            box-shadow:0 2px 12px rgba(0,0,0,0.04); border:1px solid var(--border);
            display:flex; align-items:flex-start; gap:14px;
        }
        .metric-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; }
        .ic-blue   { background:#dbeafe; color:#1d4ed8; }
        .ic-green  { background:var(--green-light); color:#059669; }
        .ic-amber  { background:var(--amber-light); color:#d97706; }
        .ic-red    { background:var(--red-light); color:#dc2626; }
        .ic-purple { background:#ede9fe; color:#7c3aed; }
        .metric-label { font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; font-weight:600; }
        .metric-value { font-size:1.75rem; font-weight:700; color:var(--text); line-height:1.1; font-family:'Space Mono',monospace; }
        .metric-sub   { font-size:0.72rem; color:var(--muted); margin-top:2px; }

        /* ===== CARDS ===== */
        .card { background:var(--surface); border-radius:16px; padding:22px; box-shadow:0 2px 12px rgba(0,0,0,0.04); border:1px solid var(--border); margin-bottom:22px; }
        .card-title { font-size:0.93rem; font-weight:700; color:var(--text); margin-bottom:18px; display:flex; align-items:center; gap:8px; }
        .card-title i { color:var(--primary); }
        .two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; }

        /* ===== TABELA ===== */
        table { width:100%; border-collapse:collapse; }
        th { text-align:left; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); font-weight:700; padding:8px 12px; border-bottom:1px solid var(--border); }
        td { padding:11px 12px; font-size:0.83rem; color:var(--text); border-bottom:1px solid #f8fafc; vertical-align:middle; }
        tr:last-child td { border-bottom:none; }
        tr:hover td { background:#fafbff; }

        /* ===== BADGES ===== */
        .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:0.72rem; font-weight:700; }
        .badge-verde    { background:var(--green-light); color:#065f46; }
        .badge-amarelo  { background:var(--amber-light); color:#92400e; }
        .badge-vermelho { background:var(--red-light);   color:#991b1b; }
        .badge-ok       { background:var(--green-light); color:#065f46; }
        .badge-warn     { background:var(--amber-light); color:#92400e; }
        .badge-danger   { background:var(--red-light);   color:#991b1b; }
        .badge-info     { background:var(--primary-light); color:#1e40af; }

        /* ===== FILA NÚMERO (cidadão) ===== */
        .fila-big { text-align:center; padding:28px 20px; }
        .fila-num { font-size:5.5rem; font-weight:700; color:var(--primary); line-height:1; font-family:'Space Mono',monospace; }
        .fila-lbl { color:var(--muted); font-size:0.88rem; margin-top:6px; }
        .fila-eta { margin-top:16px; background:var(--primary-light); color:var(--primary); border-radius:10px; padding:10px 20px; font-size:0.88rem; font-weight:600; display:inline-block; }
        .pulse { animation:pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.6;} }

        /* ===== PONTOS BAR ===== */
        .pts-bar-bg { background:var(--border); border-radius:8px; height:8px; overflow:hidden; }
        .pts-bar-fill { height:100%; border-radius:8px; background:linear-gradient(90deg,#0056b3,#38bdf8); transition:width 1.2s ease; }
        .pts-labels { display:flex; justify-content:space-between; font-size:0.72rem; color:var(--muted); margin-top:4px; }

        /* ===== PET CARD ===== */
        .pet-cards { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
        .pet-card {
            background:var(--bg); border-radius:14px; padding:16px 18px;
            border:2px solid var(--border); cursor:pointer; transition:all 0.2s;
            display:flex; align-items:center; gap:12px; min-width:180px;
        }
        .pet-card:hover,.pet-card.active { border-color:var(--primary); background:var(--primary-light); }
        .pet-emoji { font-size:2rem; width:44px; height:44px; background:white; border-radius:12px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
        .pet-info-name { font-weight:700; font-size:0.9rem; }
        .pet-info-sub  { font-size:0.75rem; color:var(--muted); }

        /* ===== MAPA ===== */
        #map-container { border-radius:14px; overflow:hidden; height:380px; background:#e8edf5; border:1px solid var(--border); position:relative; }
        #map { width:100%; height:100%; }
        .map-legend { display:flex; gap:16px; margin-top:12px; flex-wrap:wrap; }
        .map-leg-item { display:flex; align-items:center; gap:6px; font-size:0.78rem; color:var(--muted); }
        .leg-dot { width:10px; height:10px; border-radius:50%; }

        /* ===== CLINICA CARDS ===== */
        .clinica-list { display:flex; flex-direction:column; gap:12px; }
        .clinica-item {
            background:var(--bg); border-radius:12px; padding:14px 16px;
            border:1px solid var(--border); display:flex; align-items:center;
            gap:14px; transition:border-color 0.2s;
        }
        .clinica-item:hover { border-color:var(--primary); }
        .clinica-status-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
        .dot-green  { background:var(--green); }
        .dot-amber  { background:var(--amber); }
        .dot-red    { background:var(--red); }
        .clinica-info { flex:1; }
        .clinica-nome { font-weight:700; font-size:0.88rem; }
        .clinica-sub  { font-size:0.75rem; color:var(--muted); }
        .clinica-vagas { text-align:right; font-family:'Space Mono',monospace; }
        .vagas-num  { font-size:1.2rem; font-weight:700; color:var(--primary); }
        .vagas-lbl  { font-size:0.68rem; color:var(--muted); }
        .btn-maps {
            padding:7px 12px; background:var(--primary); color:white; border:none;
            border-radius:8px; font-size:0.75rem; font-weight:600; cursor:pointer;
            font-family:'Sora',sans-serif; transition:background 0.2s; white-space:nowrap;
        }
        .btn-maps:hover { background:var(--primary-hover); }

        /* ===== HISTÓRICO ===== */
        .hist-item { display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid #f1f5f9; }
        .hist-item:last-child { border-bottom:none; }
        .hist-dot { width:10px; height:10px; border-radius:50%; margin-top:4px; flex-shrink:0; }
        .hist-text { flex:1; font-size:0.83rem; }
        .hist-date { font-size:0.72rem; color:var(--muted); white-space:nowrap; }

        /* ===== ADM LIVE BADGE ===== */
        .live-dot { width:8px; height:8px; background:#ef4444; border-radius:50%; animation:livepulse 1.2s ease-in-out infinite; }
        @keyframes livepulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.5;transform:scale(0.8);} }

        /* ===== EXTRATO PONTOS ===== */
        .extrato-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #f1f5f9; }
        .extrato-item:last-child { border-bottom:none; }
        .extrato-tipo { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:0.85rem; flex-shrink:0; }
        .tipo-ganho { background:var(--green-light); color:#059669; }
        .tipo-uso   { background:var(--red-light);   color:#dc2626; }
        .extrato-desc  { flex:1; font-size:0.82rem; color:var(--text); }
        .extrato-date  { font-size:0.72rem; color:var(--muted); }
        .extrato-pontos { font-family:'Space Mono',monospace; font-weight:700; font-size:0.88rem; white-space:nowrap; }
        .pts-ganho { color:var(--green); }
        .pts-uso   { color:var(--red); }

        /* NOTIF */
        .notif {
            position:fixed; top:24px; right:24px; z-index:9999;
            background:#0a1628; color:white; padding:14px 20px;
            border-radius:12px; font-size:0.85rem; font-weight:600;
            box-shadow:0 8px 24px rgba(0,0,0,0.2);
            animation:slideIn 0.3s ease; display:none;
        }
        @keyframes slideIn { from{opacity:0;transform:translateY(-10px);} to{opacity:1;transform:translateY(0);} }

        /* MOBILE */
        @media(max-width:768px) {
            .sidebar { width:100%; height:auto; position:relative; flex-direction:row; flex-wrap:wrap; padding:12px; }
            .sb-logo,.sb-footer { display:none; }
            .sb-user { border:none; margin-bottom:0; padding:8px 4px; }
            nav { display:flex; overflow-x:auto; padding:0; }
            .nav-item { padding:10px 14px; font-size:0.75rem; white-space:nowrap; border-left:none; border-bottom:3px solid transparent; }
            .nav-item.active { border-left-color:transparent; border-bottom-color:#3b82f6; }
            .main { margin-left:0; padding:20px 14px; }
            .two-col { grid-template-columns:1fr; }
            .metrics-grid { grid-template-columns:1fr 1fr; }
        }
    </style>
</head>
<body>

<div class="notif" id="notif"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
    <div class="sb-logo">
        <i class="fa-solid fa-paw"></i>
        <div>PetSaúde REC<span id="sb-role">Carregando...</span></div>
    </div>
    <div class="sb-user">
        <div class="sb-avatar" id="sb-avatar">?</div>
        <div>
            <div class="sb-user-name" id="sb-name">—</div>
            <span class="sb-user-badge" id="sb-badge">—</span>
        </div>
    </div>
    <nav id="sidebar-nav"></nav>
    <div class="sb-footer">
        <button class="btn-logout" onclick="doLogout()">
            <i class="fa-solid fa-right-from-bracket"></i> Sair da conta
        </button>
    </div>
</aside>

<!-- MAIN -->
<main class="main" id="main"></main>

<script src="db.js"></script>
<script>
// ============================================================
// INIT — lê sessão e renderiza o perfil correto
// ============================================================
const user = PetDB.session();
if (!user) { window.location.href = 'login.html'; }

// Sidebar
document.getElementById('sb-avatar').textContent = user.avatar;
document.getElementById('sb-name').textContent   = user.nome;

const roleLabel = { cidadao:'Tutor de Pet', clinica:'Clínica Parceira', adm:'ADM / HVR' };
const badgeCls  = { cidadao:'badge-cidadao', clinica:'badge-clinica', adm:'badge-adm' };
document.getElementById('sb-role').textContent  = roleLabel[user.perfil];
document.getElementById('sb-badge').textContent = roleLabel[user.perfil];
document.getElementById('sb-badge').className   = 'sb-user-badge ' + badgeCls[user.perfil];

const navs = {
    cidadao: [
        {icon:'fa-gauge',    label:'Início',         fn:'renderCidadao'},
        {icon:'fa-list-ol',  label:'Minha Fila',     fn:'renderFila'},
        {icon:'fa-star',     label:'PetPoints',      fn:'renderPontos'},
        {icon:'fa-clock-rotate-left', label:'Histórico', fn:'renderHistorico'},
        {icon:'fa-map-marker-alt', label:'Clínicas Próximas', fn:'renderClinicas'},
    ],
    clinica: [
        {icon:'fa-gauge',   label:'Início',           fn:'renderClinicaHome'},
        {icon:'fa-arrow-right-to-bracket', label:'Encaminhamentos', fn:'renderEncaminhamentos'},
        {icon:'fa-map-marker-alt', label:'Mapa de Clínicas', fn:'renderClinicas'},
    ],
    adm: [
        {icon:'fa-gauge',   label:'Visão Geral',      fn:'renderAdmHome'},
        {icon:'fa-list-check', label:'Triagem Ativa', fn:'renderTriagemAtiva'},
        {icon:'fa-handshake', label:'Rede Parceira',  fn:'renderRedeParceira'},
        {icon:'fa-chart-bar', label:'Relatórios',     fn:'renderRelatorios'},
        {icon:'fa-map-marker-alt', label:'Mapa Clínicas', fn:'renderClinicas'},
    ],
};

const navEl = document.getElementById('sidebar-nav');
navs[user.perfil].forEach((item, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (i===0?' active':'');
    btn.dataset.fn = item.fn;
    btn.innerHTML = `<i class="fa-solid ${item.icon}"></i> ${item.label}`;
    btn.onclick = () => {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window[item.fn]();
    };
    navEl.appendChild(btn);
});

function doLogout() { PetDB.logout(); window.location.href = 'login.html'; }
function notify(msg) {
    const n = document.getElementById('notif');
    n.textContent = msg; n.style.display='block';
    setTimeout(() => n.style.display='none', 3000);
}
function fmt_data(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const hoje = new Date();
    if (d.toDateString()===hoje.toDateString()) return 'Hoje, '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function cor_badge(c) {
    return c==='vermelha'?'badge-vermelho': c==='amarela'?'badge-amarelo':'badge-verde';
}
function cor_dot(c) {
    return c==='vermelha'?'dot-red': c==='amarela'?'dot-amber':'dot-green';
}
function cor_hist(c) {
    return c==='vermelha'?'#ef4444': c==='amarela'?'#f59e0b':'#10b981';
}
function emoji_pet(e) {
    return e==='cat'?'🐱':'🐶';
}

// ============================================================
// CIDADÃO — INÍCIO
// ============================================================
function renderCidadao() {
    const pets = PetDB.petsDoTutor(user.id);
    const saldo = PetDB.saldoPetPoints(user.id);
    const fila  = PetDB.filaDoTutor(user.id);
    const filaItem = fila[0];
    const triagens = PetDB.triagensDoTutor(user.id);
    const ultimaT  = triagens[0];
    const nivel = saldo >= 500 ? 'Herói' : saldo >= 200 ? 'Protetor' : 'Iniciante';
    const proxNivel = saldo >= 500 ? 1000 : saldo >= 200 ? 500 : 200;
    const pct = Math.min(100, Math.round((saldo / proxNivel) * 100));

    const MAIN = document.getElementById('main');
    MAIN.innerHTML = `
    <div class="page-header">
        <h1>Olá, ${user.nome.split(' ')[0]}! 🐾</h1>
        <p>Bem-vindo ao seu painel. ${pets.length} pet${pets.length>1?'s':''} cadastrado${pets.length>1?'s':''}.</p>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-icon ic-blue"><i class="fa-solid fa-list-ol"></i></div>
            <div>
                <div class="metric-label">Posição na fila</div>
                <div class="metric-value">${filaItem ? filaItem.posicao+'º' : '—'}</div>
                <div class="metric-sub">${filaItem ? '~'+filaItem.eta_min+' min' : 'Sem fila ativa'}</div>
            </div>
        </div>
        <div class="metric-card">
            <div class="metric-icon ic-amber"><i class="fa-solid fa-star"></i></div>
            <div>
                <div class="metric-label">PetPoints</div>
                <div class="metric-value">${saldo}</div>
                <div class="metric-sub">Nível: ${nivel}</div>
            </div>
        </div>
        <div class="metric-card">
            <div class="metric-icon ic-green"><i class="fa-solid fa-dog"></i></div>
            <div>
                <div class="metric-label">Pets</div>
                <div class="metric-value">${pets.length}</div>
                <div class="metric-sub">${pets.map(p=>p.nome).join(', ')}</div>
            </div>
        </div>
        <div class="metric-card">
            <div class="metric-icon ic-purple"><i class="fa-solid fa-heart-pulse"></i></div>
            <div>
                <div class="metric-label">Última triagem</div>
                <div class="metric-value" style="font-size:1.1rem;margin-top:6px;">
                    ${ultimaT ? '<span class="badge '+cor_badge(ultimaT.classificacao)+'">'+ultimaT.classificacao.charAt(0).toUpperCase()+ultimaT.classificacao.slice(1)+'</span>' : '—'}
                </div>
                <div class="metric-sub">${ultimaT ? fmt_data(ultimaT.data) : 'Nenhuma'}</div>
            </div>
        </div>
    </div>

    <div class="two-col">
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-list-ol"></i> Posição na Fila HVR</div>
            ${filaItem ? `
            <div class="fila-big">
                <div class="fila-num pulse">${filaItem.posicao}</div>
                <div class="fila-lbl">pets à sua frente (${filaItem.nome_pet})</div>
                <div class="fila-eta"><i class="fa-regular fa-clock"></i> Estimativa: ~${filaItem.eta_min} minutos</div>
                <p style="margin-top:14px;font-size:0.78rem;color:var(--muted);">O Toby vai te avisar quando chegar a hora de sair de casa 🐾</p>
            </div>` : `
            <div class="fila-big" style="color:var(--muted);">
                <i class="fa-solid fa-circle-check" style="font-size:3rem;color:var(--green);"></i>
                <div class="fila-num" style="font-size:2rem;color:var(--green);">Livre!</div>
                <div class="fila-lbl">Nenhum pet seu na fila agora</div>
            </div>`}
        </div>

        <div class="card">
            <div class="card-title"><i class="fa-solid fa-star"></i> Seus PetPoints</div>
            <div style="font-size:2.5rem;font-weight:700;color:var(--primary);font-family:'Space Mono',monospace;">${saldo} <span style="font-size:1rem;font-weight:400;color:var(--muted);">pts</span></div>

        </div>
        <div class="metric-card">
            <div class="metric-icon ic-amber"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div><div class="metric-label">Triagens amarelas</div><div class="metric-value">${amarelas}</div><div class="metric-sub">${pct(amarelas)}% do total</div></div>
        </div>
        <div class="metric-card">
            <div class="metric-icon ic-red"><i class="fa-solid fa-bolt"></i></div>
            <div><div class="metric-label">Emergências</div><div class="metric-value">${vermelhas}</div><div class="metric-sub">${pct(vermelhas)}% do total</div></div>
        </div>
        <div class="metric-card">
            <div class="metric-icon ic-blue"><i class="fa-solid fa-database"></i></div>
            <div><div class="metric-label">Total no banco</div><div class="metric-value">${total}</div><div class="metric-sub">triagens registradas</div></div>
        </div>
    </div>
    <div class="card">
        <div class="card-title"><i class="fa-solid fa-chart-bar"></i> Distribuição por Classificação</div>
        <div style="display:flex;flex-direction:column;gap:16px;">
            ${[['verde','Verde — Rotina',verdes,pct(verdes),'#10b981'],['amarela','Amarela — Urgência',amarelas,pct(amarelas),'#f59e0b'],['vermelha','Vermelha — Emergência',vermelhas,pct(vermelhas),'#ef4444']].map(([_,label,n,p,color]) => `
            <div>
                <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:0.83rem;">
                    <span><b>${label}</b></span><span>${n} (${p}%)</span>
                </div>
                <div style="background:var(--border);border-radius:8px;height:10px;overflow:hidden;">
                    <div style="height:100%;width:${p}%;background:${color};border-radius:8px;transition:width 1s;"></div>
                </div>
            </div>`).join('')}
        </div>
        <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--border);font-size:0.82rem;color:var(--muted);">
            <b>Impacto real:</b> ${verdes} atendimentos de rotina foram redirecionados da fila do HVR para agendamento, reduzindo a superlotação em aproximadamente ${pct(verdes)}%.
        </div>
    </div>`;
}

// BOOT: renderiza tela inicial do perfil
const firstRender = { cidadao: renderCidadao, clinica: renderClinicaHome, adm: renderAdmHome };
firstRender[user.perfil]();
</script>
